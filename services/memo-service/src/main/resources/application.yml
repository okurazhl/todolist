server:
  port: 8082

spring:
  application:
    name: memo-service
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/smartmemo
    username: ${DB_USER:smartmemo}
    password: ${DB_PASSWORD:smartmemo_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin_dev}
  bucket: ${MINIO_BUCKET:smartmemo-attachments}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.smartmemo.memo: DEBUG
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","service":"${spring.application.name}","traceId":"%X{traceId:-}","message":"%msg"}%n'
