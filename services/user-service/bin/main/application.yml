server:
  port: 8081

spring:
  application:
    name: user-service
  profiles:
    active: local

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/smartmemo
    username: ${DB_USER:smartmemo}
    password: ${DB_PASSWORD:smartmemo_dev}
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:smartmemo_dev}

# JWT 配置
jwt:
  secret: ${JWT_SECRET:smartmemo-dev-secret-key-change-in-production-min-256-bits}
  access-token-expiration: 900          # 15 分钟
  refresh-token-expiration: 604800      # 7 天

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 日志
logging:
  level:
    com.smartmemo.user: DEBUG
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","service":"${spring.application.name}","traceId":"%X{traceId:-}","message":"%msg"}%n'
