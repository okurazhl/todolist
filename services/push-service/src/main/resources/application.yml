server:
  port: 8084

spring:
  application:
    name: push-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/smartmemo
    username: ${DB_USER:smartmemo}
    password: ${DB_PASSWORD:smartmemo_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

sync:
  service:
    url: ${SYNC_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.smartmemo.push: DEBUG
