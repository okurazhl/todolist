server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: local
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        # ===== 健康检查（Gateway 自身） =====
        - id: health
          uri: no://op
          predicates:
            - Path=/actuator/**
          filters:
            - StripPrefix=0

        # ===== 用户服务路由 =====
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-users
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
        - id: user-service-devices
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/devices/**

        # ===== 备忘录服务路由 =====
        - id: memo-service-memos
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/memos/**
        - id: memo-service-tags
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/tags/**
        - id: memo-service-categories
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/categories/**
        - id: memo-service-attachments
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/attachments/**

        # ===== ASR 服务路由 =====
        - id: asr-service
          uri: http://localhost:8006
          predicates:
            - Path=/api/v1/asr/**

        # ===== AI 服务路由 =====
        - id: ai-service
          uri: http://localhost:8007
          predicates:
            - Path=/api/v1/ai/**

  # Redis 连接（限流用）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:smartmemo_dev}

# JWT 配置（与 user-service 保持一致）
jwt:
  secret: ${JWT_SECRET:smartmemo-dev-secret-key-change-in-production-min-256-bits}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 日志
logging:
  level:
    com.smartmemo.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","service":"${spring.application.name}","traceId":"%X{traceId:-}","message":"%msg"}%n'
